name: flutter_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 2.3.1+6

environment:
  sdk: ^3.13.1


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  wakelock_plus: ^1.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # 브랜드 이미지: 앱 로고 · 팀 엠블렘 · 팀 대표 이미지 (docs/design/make_brand.js 로 생성)
  assets:
    - assets/images/

  # 글꼴: UI = Pretendard(산세리프), 본문 = Noto Serif KR(세리프, 가변)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Variable.ttf
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/bookchain_app_icon.png"
  adaptive_icon_background: "#8E1821"
  adaptive_icon_foreground: "assets/images/bookchain_app_icon.png"
