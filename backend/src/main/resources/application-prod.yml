server:
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 6MB
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 5000
      initialization-fail-timeout: 10000
  mvc:
    async:
      request-timeout: ${REQUEST_TIMEOUT_MS:30000}
app:
  # Must be a persistent mounted volume or object-storage gateway path.
  profile-upload-dir: ${PROFILE_UPLOAD_DIR}
