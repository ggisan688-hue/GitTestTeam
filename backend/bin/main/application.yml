server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful
spring:
  application:
    name: change-book-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # The shared database already contains objects but has no Flyway history.
    # Version 0 records only this application's starting point, so V1 still
    # runs and no existing table or data is treated as this project's schema.
    baseline-on-migrate: true
    baseline-version: 0
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:20}
    max-requests-per-email: ${PASSWORD_RESET_MAX_REQUESTS_PER_EMAIL:3}
    max-requests-per-ip: ${PASSWORD_RESET_MAX_REQUESTS_PER_IP:10}
    rate-limit-window-minutes: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:60}
    url: ${PASSWORD_RESET_URL:}
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
